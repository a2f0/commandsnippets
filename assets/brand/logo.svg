<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" color="#f2f2f2">
  <title>Command Snippets</title>
  <!-- A shell prompt, >_, on a rounded tile: the tile keeps it legible as a
       16px favicon on light and dark tabs alike. Grayscale, as the app is. -->
  <rect id="tile" width="64" height="64" rx="14" fill="#2a2a2a"/>
  <g id="prompt" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 19 L28 32 L15 45"/>
    <path d="M35 45 H49"/>
  </g>
</svg>
