---
- name: Regular DB Backups
  ansible.builtin.cron:
    name: "api database backup"
    minute: "0"
    hour: "5"
    job: >-
      cd /home/{{ ansible_user }}/commandsnippets/backend/ &&
      docker compose -f compose-container-registry.yaml run --rm postgres backup
      >>/home/{{ ansible_user }}/db-backup-log 2>&1
    user: "{{ ansible_user }}"
