---
- name: Create patch and reboot script
  become: true
  copy:
    dest: "/home/{{ ansible_user }}/patch-and-reboot.sh"
    mode: '0755'
    content: |
      #!/bin/bash

      echo ""
      echo "=== Patch and reboot started at $(date) ==="

      export DEBIAN_FRONTEND=noninteractive
      sudo apt-get -y update
      sudo apt-get -y upgrade
      sudo apt-get -y autoremove
      sudo apt-get -y autoclean
      sudo /sbin/shutdown -r now

- name: Set up daily patching cron job
  become: true
  cron:
    name: "Daily system patch and reboot"
    user: "{{ ansible_user }}"
    hour: "3"
    minute: "0"
    job: "/home/{{ ansible_user }}/patch-and-reboot.sh >>/home/{{ ansible_user }}/patch-reboot-log 2>&1"
