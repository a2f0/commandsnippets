- name: create .aws directory
  file:
    path: ~/.aws
    state: directory
    mode: '0700'

- name: configure aws credentials
  copy:
    dest: ~/.aws/credentials
    mode: '0600'
    content: |
      [default]
      aws_access_key_id = {{ lookup('env', 'ECR_ACCESS_KEY_ID') }}
      aws_secret_access_key = {{ lookup('env', 'ECR_SECRET_ACCESS_KEY') }}

- name: configure aws region
  copy:
    dest: ~/.aws/config
    mode: '0600'
    content: |
      [default]
      region = us-east-1
