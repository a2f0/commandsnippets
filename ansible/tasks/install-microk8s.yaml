- name: Install microk8s with --classic
  community.general.snap:
    name: microk8s
    classic: yes

- name: Install kubectl with --classic
  community.general.snap:
    name: kubectl
    classic: yes

- name: Create ~/.kube for the deploy user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Add the application service account to the microk8s group
  user:
    name: "{{ ansible_user }}"
    groups: microk8s
