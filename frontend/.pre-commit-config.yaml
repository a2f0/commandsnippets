---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$
  - repo: local
    hooks:
      - id: biome-check-fix
        name: biome check --write
        entry: pnpm exec biome check --write
        pass_filenames: false
        language: system
      - id: tsc -b
        name: tsc -b
        entry: pnpm tsc -b
        pass_filenames: false
        language: system
      - id: yamllint
        name: yamllint
        entry: yamllint .
        pass_filenames: false
        language: system
