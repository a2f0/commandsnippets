# `bun test` runs only the Node-side scripts (scripts/*.test.ts); the Worker's
# tests (which also cover src/, imported here for date parsing) run under
# vitest in workerd. Same 98% line bar as the Worker.
[test]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["src/**"]
coverageThreshold = { lines = 0.98, functions = 0.95 }
