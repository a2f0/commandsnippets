---
- name: Clone the commandsnippets monorepo
  ansible.builtin.git:
    repo: https://github.com/a2f0/commandsnippets.git
    dest: "/home/{{ ansible_user }}/commandsnippets"
    force: false
    recursive: false
    version: "{{ 'main' if 'production' in group_names else 'staging' }}"

- name: Remove the legacy standalone backend checkout
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/tearleads-backend"
    state: absent

- name: Remove legacy repository deploy credentials
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.ssh/{{ item }}"
    state: absent
  loop:
    - config
    - tearleads-backend-deploy-key
    - tearleads-frontend-deploy-key
