---
- name: Check for the commandsnippets Git checkout
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/commandsnippets/.git"
  register: commandsnippets_git_checkout

- name: Clone the monorepo without checking out unrelated files
  ansible.builtin.command:
    argv:
      - git
      - clone
      - --filter=blob:none
      - --no-checkout
      - --single-branch
      - --branch
      - "{{ 'main' if 'production' in group_names else 'staging' }}"
      - https://github.com/a2f0/commandsnippets.git
      - "/home/{{ ansible_user }}/commandsnippets"
  when: not commandsnippets_git_checkout.stat.exists
  changed_when: true

- name: Read the monorepo sparse-checkout paths
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "/home/{{ ansible_user }}/commandsnippets"
      - sparse-checkout
      - list
  register: commandsnippets_sparse_checkout
  changed_when: false
  failed_when: false

- name: Restrict the monorepo checkout to the backend
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "/home/{{ ansible_user }}/commandsnippets"
      - sparse-checkout
      - set
      - --no-cone
      - /backend/
  when: >-
    commandsnippets_sparse_checkout.rc != 0 or
    commandsnippets_sparse_checkout.stdout | trim not in ['backend', '/backend/']
  changed_when: true

- name: Materialize the backend for a new checkout
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "/home/{{ ansible_user }}/commandsnippets"
      - checkout
      - "{{ 'main' if 'production' in group_names else 'staging' }}"
  when: not commandsnippets_git_checkout.stat.exists
  changed_when: true

- name: Update the backend checkout from the monorepo
  ansible.builtin.git:
    repo: https://github.com/a2f0/commandsnippets.git
    dest: "/home/{{ ansible_user }}/commandsnippets"
    force: false
    recursive: false
    version: "{{ 'main' if 'production' in group_names else 'staging' }}"

- name: Remove the legacy standalone backend checkout
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/tearleads-backend"
    state: absent

- name: Remove legacy repository deploy credentials
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.ssh/{{ item }}"
    state: absent
  loop:
    - config
    - tearleads-backend-deploy-key
    - tearleads-frontend-deploy-key
