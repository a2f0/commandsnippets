---
- name: Install the GitHub Actions deploy key
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    state: present
    key: >-
      {{ lookup('ansible.builtin.file',
      playbook_dir + '/public_ssh_keys/github_actions.pub') }}

- name: Remove the legacy GitHub Actions deploy key
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    regexp: " deploy@pine$"
    state: absent
