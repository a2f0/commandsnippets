---
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  # Root tooling (commitlint, TypeScript, agent-tool); SHA-pinned actions above
  # are bumped along with their `# vX.Y.Z` comments.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'bun'
    directory: '/packages/backend-v2'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'pip'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'pre-commit'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'docker-compose'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'docker'
    directory: '/backend/compose/django'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'docker'
    directory: '/backend/compose/postgres'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'npm'
    directory: '/packages/frontend'
    schedule:
      interval: 'monthly'
