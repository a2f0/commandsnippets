---
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'pip'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'pre-commit'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'docker-compose'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'docker'
    directory: '/backend/compose/django'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'docker'
    directory: '/backend/compose/nginx-proxy'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'a2f0'

  - package-ecosystem: 'docker'
    directory: '/backend/compose/postgres'
    schedule:
      interval: 'monthly'
