---
# The aggregate `CI gate` job is the check the protect-main ruleset requires;
# see docs/ci-merge-gate.md. Scoped jobs run only when change detection says
# they apply, and the gate fails closed on anything else.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect required checks
    runs-on: ubuntu-latest
    outputs:
      tooling: ${{ steps.scopes.outputs.tooling }}
      frontend: ${{ steps.scopes.outputs.frontend }}
      backendV2: ${{ steps.scopes.outputs.backendV2 }}
      apiShared: ${{ steps.scopes.outputs.apiShared }}
      website: ${{ steps.scopes.outputs.website }}
      terraform: ${{ steps.scopes.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun and Node with mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
      - name: Determine required checks
        id: scopes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/checks/ciChanges.ts

  tooling:
    name: Tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun and Node with mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
      # The root workspace alone: the tooling, not the packages' dependencies.
      - name: Install root tooling
        run: bun install --frozen-lockfile --filter commandsnippets
      - name: Lint shell scripts
        run: bun run lint:shell
      - name: Typecheck
        run: bun run typecheck
      - name: Check managed skills
        run: bun run agents:check
      - name: Test hooks and CI policy
        run: bun run test:scripts

  # The application workflows are reusable; backend-v2's deploy job is guarded
  # so it never runs from here.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  backend-v2:
    needs: changes
    if: needs.changes.outputs.backendV2 == 'true'
    uses: ./.github/workflows/backend-v2.yml
    secrets: inherit

  api-shared:
    needs: changes
    if: needs.changes.outputs.apiShared == 'true'
    uses: ./.github/workflows/api-shared.yml

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/website.yml

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform.yml

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - tooling
      - backend-v2
      - api-shared
      - frontend
      - website
      - terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun and Node with mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
      # The root workspace alone: the tooling, not the packages' dependencies.
      - name: Install tooling dependencies
        run: bun install --frozen-lockfile --filter commandsnippets
      - name: Check managed skills
        run: bun run agents:check
      - name: Validate PR branch and title
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bun run lint:branch-name "$HEAD_REF"
          bun run lint:pr-title
      - name: Require every applicable check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$CI_NEEDS" | bun run agent-tool ci gate - --policy scripts/checks/ciGate.json
