---
# The aggregate `CI gate` job is the check the protect-main ruleset requires;
# see docs/ci-merge-gate.md. Scoped jobs run only when change detection says
# they apply, and the gate fails closed on anything else.
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:

# The frontend lanes install packages from GitHub Packages.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect required checks
    runs-on: ubuntu-latest
    outputs:
      tooling: ${{ steps.scopes.outputs.tooling }}
      backend: ${{ steps.scopes.outputs.backend }}
      frontend: ${{ steps.scopes.outputs.frontend }}
      mobile: ${{ steps.scopes.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Determine required checks
        id: scopes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/checks/ciChanges.ts

  tooling:
    name: Tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Dependabot names its branches `dependabot/<ecosystem>/...`, which is
      # not a conventional type; its PRs still get every other check.
      - name: Lint branch name
        if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'dependabot/')
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bun run lint:branch-name "$HEAD_REF"
      - name: Lint shell scripts
        run: bun run lint:shell
      - name: Typecheck
        run: bun run typecheck
      - name: Test agent-tool
        run: bun run test:agent-tool
      - name: Test hooks and CI policy
        run: bun run test:scripts

  # The application workflows are reusable; their deploy jobs are guarded so
  # they never run from here.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/frontend-ios-testing.yml
    secrets: inherit

  # The Android lane is out of the gate until its workflow is fixed (SDK
  # setup and AVD creation fail on current runners); run it by hand with
  # workflow_dispatch. See docs/ci-merge-gate.md.

  gate:
    name: CI gate
    if: always()
    needs: [changes, tooling, backend, frontend, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Require every applicable check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/checks/ciGate.ts
