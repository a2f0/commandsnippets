---
name: Backend CI
# yamllint disable-line rule:truthy
# Pull requests run this through `CI` (ci.yml, the required `CI gate`); pushes to
# the long-lived branches and the nightly schedule rerun the checks.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'scripts/runBackendTests.sh'
      - '.github/workflows/backend.yml'
  schedule:
    - cron: '0 0 * * *'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          architecture: 'x64'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: |
          cd ..
          git ls-files -z backend | xargs -0 pre-commit run \
            --config backend/.pre-commit-config.yaml --files
      - name: install and configure python dependencies
        run: pip install --no-cache-dir -r ./requirements/local.txt
      - name: run tests / coverage analysis
        run: ../scripts/runBackendTests.sh
