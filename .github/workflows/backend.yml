---
name: Backend CI
# yamllint disable-line rule:truthy
# Pull requests run this through `CI` (ci.yml, the required `CI gate`); the push
# trigger remains for the deploy branches.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'scripts/deployApi.sh'
      - 'scripts/deployProductionApi.sh'
      - 'scripts/deployStagingApi.sh'
      - 'scripts/runBackendTests.sh'
      - '.github/workflows/backend.yml'
  schedule:
    - cron: '0 0 * * *'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          architecture: 'x64'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: |
          cd ..
          git ls-files -z backend | xargs -0 pre-commit run \
            --config backend/.pre-commit-config.yaml --files
      - name: install and configure python dependencies
        run: pip install --no-cache-dir -r ./requirements/local.txt
      - name: run tests / coverage analysis
        run: ../scripts/runBackendTests.sh
  push-containers:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: code-quality
    # Never when called from `CI`: a reusable workflow sees the caller's context.
    if: >-
      github.workflow == 'Backend CI' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - name: Build and push staging images to Amazon ECR
        if: github.ref == 'refs/heads/staging'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: ../scripts/deployStagingApi.sh image
      - name: Build and push production images to Amazon ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: ../scripts/deployProductionApi.sh image
  deploy-code:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: push-containers
    # Never when called from `CI`: a reusable workflow sees the caller's context.
    if: >-
      github.workflow == 'Backend CI' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy production via SSH
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FQDN: ${{ secrets.DEPLOY_PRODUCTION_FQDN }}
          DEPLOY_KNOWN_HOSTS_BASE64: >-
            ${{ secrets.PRODUCTION_KNOWN_HOSTS_BASE64 }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: ./scripts/deployProductionApi.sh remote
      - name: Deploy staging via SSH
        if: github.ref == 'refs/heads/staging'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FQDN: ${{ secrets.DEPLOY_STAGING_FQDN }}
          DEPLOY_KNOWN_HOSTS_BASE64: >-
            ${{ secrets.STAGING_KNOWN_HOSTS_BASE64 }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: ./scripts/deployStagingApi.sh remote
