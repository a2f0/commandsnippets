---
name: Backend CI
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: '**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: '**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  schedule:
    - cron: '0 0 * * *'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          architecture: 'x64'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: |
          cd ..
          git ls-files -z backend | xargs -0 pre-commit run \
            --config backend/.pre-commit-config.yaml --files
      - name: install and configure python dependencies
        run: pip install --no-cache-dir -r ./requirements/local.txt
      - name: run tests / coverage analysis
        run: |
          coverage run manage.py test -v 2
          # Configuration is in .coveragerc.
          coverage report
        env:
          COOKIE_DOMAIN: localhost
          DJANGO_SECRET_KEY: test
          DJANGO_SETTINGS_MODULE: tearleads.settings.test
          GITHUB_CLIENT_ID: github_client_id
          GITHUB_CLIENT_SECRET: github_client_secret
          GOOGLE_CLIENT_ID: google_client_id
          GOOGLE_CLIENT_SECRET: google_client_secret
          GOOGLE_REDIRECT_URI: google_redirect_uri
          POSTGRES_DB: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
  push-containers:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: code-quality
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - name: Build and push staging images to Amazon ECR
        if: github.ref == 'refs/heads/staging'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f compose/django/Dockerfile.prod \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:backend-staging-latest" \
            --push \
            .
      - name: Build and push production images to Amazon ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f compose/django/Dockerfile.prod \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:backend-production-latest" \
            --push \
            .
  deploy-code:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: push-containers
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    steps:
      - name: Setup SSH Private Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Deploy production via SSH
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FQDN: ${{ secrets.DEPLOY_PRODUCTION_FQDN }}
        run: |
          echo "${{ secrets.PRODUCTION_KNOWN_HOSTS_BASE64 }}" |
            base64 -d > ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_FQDN" \
            'cd "$HOME/commandsnippets" && git pull --ff-only origin main'
          ssh "$DEPLOY_USER@$DEPLOY_FQDN" \
            'exec "$HOME/commandsnippets/backend/deploy-containers.sh"'
      - name: Deploy staging via SSH
        if: github.ref == 'refs/heads/staging'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FQDN: ${{ secrets.DEPLOY_STAGING_FQDN }}
        run: |
          echo "${{ secrets.STAGING_KNOWN_HOSTS_BASE64 }}" |
            base64 -d > ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_FQDN" \
            'cd "$HOME/commandsnippets" && git pull --ff-only origin staging'
          ssh "$DEPLOY_USER@$DEPLOY_FQDN" \
            'exec "$HOME/commandsnippets/backend/deploy-containers.sh"'
