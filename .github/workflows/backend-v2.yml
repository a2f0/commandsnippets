---
name: Backend v2 CI
# Pull requests run this through `CI` (ci.yml, the required `CI gate`); the push
# trigger remains for the deploy branches. The Worker bundles api-shared, so a
# change there deploys too, and its dependencies are locked by the root
# workspace files (package.json, bunfig.toml, bun.lock).
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, staging]
    paths:
      - '.mise.toml'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - 'packages/backend-v2/**'
      - 'packages/api-shared/**'
      - '.github/workflows/backend-v2.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run cf-typegen && bun run typecheck
      - name: Test with coverage (fails under 98%)
        run: bun run test:coverage
      - name: Test management scripts and migrations (fails under 98%)
        run: bun run test:scripts
  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Never when called from `CI` (a reusable workflow sees the caller's
    # context), and off until the BACKEND_V2_DEPLOY repository variable is
    # `true` and the CLOUDFLARE_* secrets exist (docs/ci-merge-gate.md).
    if: >-
      github.workflow == 'Backend v2 CI' &&
      github.event_name == 'push' &&
      vars.BACKEND_V2_DEPLOY == 'true' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: packages/backend-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: >-
        ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
      - name: Deploy
        run: bunx wrangler deploy --env "$DEPLOY_ENV"
