---
name: Backend v2 CI
# Pull requests and pushes to main run this through `CI` (ci.yml, the required
# `CI gate`), which sets `deploy` on a push to main; this workflow's own push
# trigger remains for staging. Every staging push runs it, like every push to
# main, so the branch's tip always has a run that can deploy it.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: Deploy production once the tests pass (CI, on a push to main)
        type: boolean
        default: false
  push:
    branches: [staging]
# This workflow's own pushes to staging run one at a time, queued as they
# start, and a started run is never cancelled, so staging deploys never
# overlap; GitHub keeps one waiting run, which a newer push replaces. Any other
# run gets a group of its own and never waits: from `CI` (whose context a
# called workflow sees), ci.yml queues main's pushes itself.
concurrency:
  group: >-
    backend-v2-${{ github.workflow == 'Backend v2 CI' && github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run cf-typegen && bun run typecheck
      - name: Test with coverage (fails under 98%)
        run: bun run test:coverage
      - name: Test management scripts and migrations (fails under 98%)
        run: bun run test:scripts
  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Production from `CI`'s call with `deploy` on a push to main; staging from
    # this workflow's own push trigger (a reusable workflow sees its caller's
    # context, so `github.workflow` tells the two apart). Never for a pull
    # request or a manual run, and off until the BACKEND_V2_DEPLOY repository
    # variable is `true` and the CLOUDFLARE_* secrets exist
    # (docs/ci-merge-gate.md). Runs that deploy from a branch go one at a time
    # (the `concurrency` of ci.yml and of this workflow).
    if: >-
      github.event_name == 'push' &&
      vars.BACKEND_V2_DEPLOY == 'true' &&
      ((github.workflow == 'Backend v2 CI' && github.ref == 'refs/heads/staging') ||
      (inputs.deploy && github.ref == 'refs/heads/main'))
    defaults:
      run:
        working-directory: packages/backend-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: >-
        ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Concurrency queues runs, but cannot promise push order (a run can start
      # late, or be rerun): a run whose commit a newer push superseded stands
      # down rather than ship older code, and the newer push's run deploys.
      - name: Check that this commit is still the tip of its branch
        id: tip
        working-directory: .
        run: sh scripts/checks/ciBranchTip.sh
      - name: Apply D1 migrations
        if: steps.tip.outputs.current == 'true'
        run: bunx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
      - name: Deploy
        if: steps.tip.outputs.current == 'true'
        run: bunx wrangler deploy --env "$DEPLOY_ENV"
