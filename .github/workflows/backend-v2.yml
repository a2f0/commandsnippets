---
name: Backend v2 CI
# Pull requests and pushes to main run this through `CI` (ci.yml, the required
# `CI gate`), which sets `deploy` on a push to main; this workflow's own push
# trigger remains for staging. The Worker bundles api-shared, so a change there
# deploys too, and its dependencies are locked by the root workspace files
# (package.json, bunfig.toml, bun.lock).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: Deploy production once the tests pass (CI, on a push to main)
        type: boolean
        default: false
  push:
    branches: [staging]
    paths:
      - '.mise.toml'
      - 'mise.lock'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - 'packages/backend-v2/**'
      - 'packages/api-shared/**'
      - '.github/actions/setup/**'
      - '.github/workflows/backend-v2.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run cf-typegen && bun run typecheck
      - name: Test with coverage (fails under 98%)
        run: bun run test:coverage
      - name: Test management scripts and migrations (fails under 98%)
        run: bun run test:scripts
  # Whether this run may deploy, and whether its commit is still the tip of its
  # branch once the tests pass. A run that a newer push superseded deploys
  # nothing and never queues for the deploy lock, where it could replace the
  # newer run's waiting deploy.
  tip:
    runs-on: ubuntu-latest
    needs: test
    # Production from `CI`'s call with `deploy` on a push to main; staging from
    # this workflow's own push trigger (a reusable workflow sees its caller's
    # context, so `github.workflow` tells the two apart). Never for a pull
    # request or a manual run, and off until the BACKEND_V2_DEPLOY repository
    # variable is `true` and the CLOUDFLARE_* secrets exist
    # (docs/ci-merge-gate.md).
    if: >-
      github.event_name == 'push' &&
      vars.BACKEND_V2_DEPLOY == 'true' &&
      ((github.workflow == 'Backend v2 CI' && github.ref == 'refs/heads/staging') ||
      (inputs.deploy && github.ref == 'refs/heads/main'))
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that this commit is still the tip of its branch
        id: tip
        run: sh scripts/checks/ciBranchTip.sh
  deploy:
    runs-on: ubuntu-latest
    needs: [test, tip]
    if: needs.tip.outputs.current == 'true'
    # One deploy per environment at a time, never cancelled once it starts.
    # GitHub keeps one waiting job per group, so a newer push's deploy
    # replaces a waiting one; the newer commit carries the replaced one's code.
    concurrency:
      group: backend-v2-deploy-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: packages/backend-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: >-
        ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Again inside the lock: a push that landed since the first check deploys
      # from its own run, so this one stands down rather than risk shipping
      # older code after it.
      - name: Check that this commit is still the tip of its branch
        id: tip
        working-directory: .
        run: sh scripts/checks/ciBranchTip.sh
      - name: Apply D1 migrations
        if: steps.tip.outputs.current == 'true'
        run: bunx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
      - name: Deploy
        if: steps.tip.outputs.current == 'true'
        run: bunx wrangler deploy --env "$DEPLOY_ENV"
