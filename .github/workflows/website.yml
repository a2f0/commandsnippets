---
name: Website CI
# Pull requests run this through `CI` (ci.yml, the required `CI gate`).
on:
  workflow_dispatch:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
      # One workspace install from the root bun.lock, including the root's
      # pinned agent-tool, which renders the icons from assets/brand.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck (astro check)
        run: bun run check
      - name: Build and test the staging and production sites
        run: bun run test
