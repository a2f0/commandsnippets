---
name: Website CI
# Pull requests run this through `CI` (ci.yml, the required `CI gate`).
on:
  workflow_dispatch:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint
      - name: Typecheck (astro check)
        run: bun run check
      - name: Build and test the staging and production sites
        run: bun run test
