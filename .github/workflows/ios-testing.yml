---
name: iOS Mobile Testing

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: '**'

jobs:
  ios-appium-tests:
    runs-on: macos-15
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tearleads'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Configure npm auth
        # yamllint disable-line rule:line-length
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: List available iOS simulators
        run: xcrun simctl list devices available

      - name: Check for iPhone 16 simulator
        run: |
          if xcrun simctl list devices available | \
             grep -q "iPhone 16"; then
            echo "iPhone 16 simulator is available"
          else
            echo "iPhone 16 simulator not found, listing devices:"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Create required directories
        run: |
          mkdir -p logs/screenshots
          mkdir -p logs/appium

      - name: Build production app with Capacitor (for testing)
        run: pnpm run cap:build:production

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          # Install pods and ensure they're properly integrated
          pod install --verbose
          echo "Checking Pods directory..."
          ls -la Pods/ || true

      - name: Build iOS app for simulator
        run: |
          cd ios/App
          # Clean build folder to ensure fresh build
          rm -rf build
          # Build for simulator with explicit simulator targeting
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="x86_64 arm64" \
            VALID_ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify iOS build output
        run: |
          echo "Checking for built app..."
          APP_PATH="ios/App/build/Build/Products/Release-iphonesimulator/App.app"
          if [ -d "$APP_PATH" ]; then
            echo "✅ App.app found at expected location"
            ls -la \
              ios/App/build/Build/Products/Release-iphonesimulator/
          else
            echo "❌ App.app not found!"
            echo "Contents of build directory:"
            find ios/App/build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

      - name: Start iOS simulator
        run: |
          # Ensure clean simulator environment
          echo "Shutting down any existing simulators..."
          xcrun simctl shutdown all || true
          sleep 5

          # Get UUID of iPhone 16 simulator
          DEVICE_UUID=$(xcrun simctl list devices available | \
            grep "iPhone 16 (" | head -1 | \
            sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "Found iPhone 16 simulator with UUID: \
            $DEVICE_UUID"

          # Reset simulator to clean state to avoid data migration issues
          echo "Resetting simulator to clean state..."
          xcrun simctl erase "$DEVICE_UUID" || true
          sleep 5

          # Boot the simulator
          echo "Booting simulator..."
          xcrun simctl boot "$DEVICE_UUID"

          # Wait for simulator to boot and be ready (check every 10 seconds, \
            up to 1 minute)
          echo "Waiting for simulator to boot \
            completely..."
          for i in {1..6}; do
            if xcrun simctl list devices | grep "$DEVICE_UUID" | \
              grep -q "Booted"; then
              echo "Simulator is booted after $((i*10)) seconds"
              # Wait additional time for services to be ready
              echo "Allowing additional 20 seconds for services to fully \
                initialize..."
              sleep 20
              break
            fi
            if [ $i -eq 6 ]; then
              echo "Simulator failed to boot within 1 minute"
              xcrun simctl list devices | grep "$DEVICE_UUID"
              exit 1
            fi
            echo "Still waiting for boot (attempt $i/6)..."
            sleep 10
          done

      - name: Run Appium iOS tests
        run: pnpm run appium:ios
        timeout-minutes: 10

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-screenshots
          path: logs/screenshots/

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-logs
          path: |
            logs/appium/
            appium.log

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all
