---
name: iOS Mobile Testing

# yamllint disable-line rule:truthy
on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  ios-appium-tests:
    runs-on: macos-13
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tearleads'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Configure npm auth
        # yamllint disable-line rule:line-length
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: List available iOS simulators
        run: xcrun simctl list devices available

      - name: Check for iPhone 15 simulator
        run: |
          if xcrun simctl list devices available | \
             grep -q "iPhone 15"; then
            echo "iPhone 15 simulator is available"
          else
            echo "iPhone 15 simulator not found, listing devices:"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Create required directories
        run: |
          mkdir -p logs/screenshots
          mkdir -p logs/appium

      - name: Build production app with Capacitor (for testing)
        run: pnpm run cap:build:production

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          # Install pods and ensure they're properly integrated
          pod install --verbose
          echo "Checking Pods directory..."
          ls -la Pods/ || true

      - name: Build iOS app for simulator
        run: |
          cd ios/App
          # Clean build folder to ensure fresh build
          rm -rf build
          # Build for simulator with explicit simulator targeting
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="x86_64 arm64" \
            VALID_ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify iOS build output
        run: |
          echo "Checking for built app..."
          APP_PATH="ios/App/build/Build/Products/Release-iphonesimulator/App.app"
          if [ -d "$APP_PATH" ]; then
            echo "✅ App.app found at expected location"
            ls -la \
              ios/App/build/Build/Products/Release-iphonesimulator/
          else
            echo "❌ App.app not found!"
            echo "Contents of build directory:"
            find ios/App/build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

      - name: Start iOS simulator
        run: |
          # Boot iPhone 15 simulator
          # Get UUID of iPhone 15 simulator
          DEVICE_UUID=$(xcrun simctl list devices available | \
            grep "iPhone 15 (" | head -1 | \
            sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "Starting simulator with UUID: $DEVICE_UUID"
          xcrun simctl boot "$DEVICE_UUID" || true
          sleep 10

      - name: Run Appium iOS tests
        run: pnpm run appium:ios
        timeout-minutes: 15

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-screenshots
          path: logs/screenshots/

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-logs
          path: |
            logs/appium/
            appium.log

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all
