---
name: iOS Mobile Testing

# yamllint disable-line rule:truthy
on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  ios-appium-tests:
    runs-on: macos-13
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tearleads'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Configure npm auth
        # yamllint disable-line rule:line-length
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: List available iOS simulators
        run: xcrun simctl list devices available

      - name: Check for iPhone 15 simulator
        run: |
          if xcrun simctl list devices available | \
             grep -q "iPhone 15"; then
            echo "iPhone 15 simulator is available"
          else
            echo "iPhone 15 simulator not found, listing devices:"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Create required directories
        run: |
          mkdir -p logs/screenshots
          mkdir -p logs/appium

      - name: Build staging app with Capacitor
        run: pnpm run cap:build:staging

      - name: Build iOS app for simulator
        run: |
          cd ios/App
          xcodebuild clean \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            BUILD_DIR=build/Build/Products

      - name: Start iOS simulator
        run: |
          # Boot iPhone 15 simulator
          # Get UUID of iPhone 15 simulator
          DEVICE_UUID=$(xcrun simctl list devices available | \
            grep "iPhone 15 (" | head -1 | \
            sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "Starting simulator with UUID: $DEVICE_UUID"
          xcrun simctl boot "$DEVICE_UUID" || true
          sleep 10

      - name: Run Appium iOS tests
        run: pnpm run appium:ios
        timeout-minutes: 15

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-screenshots
          path: logs/screenshots/

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-logs
          path: |
            logs/appium/
            appium.log

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all
