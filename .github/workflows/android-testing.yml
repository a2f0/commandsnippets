---
name: Android Mobile Testing

# yamllint disable-line rule:truthy
on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  android-appium-tests:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tearleads'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Configure npm auth
        # yamllint disable-line rule:line-length
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 6

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: android-${{ runner.os }}-${{ hashFiles('android/**') }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Create required directories
        run: |
          mkdir -p logs/screenshots
          mkdir -p logs/appium

      - name: Build staging web app
        run: pnpm run build:staging

      - name: Sync Capacitor for staging
        run: pnpm run cap:sync:staging

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          echo "APK build completed"
          ls -la app/build/outputs/apk/debug/

      - name: Verify Android APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK found at expected location"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK not found!"
            find android -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi

      - name: Run Android Appium tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            # Install UiAutomator2 driver (using local Appium)
            pnpm exec appium driver install uiautomator2
            
            # Wait for emulator to fully boot
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed | \
              tr -d "\r") ]]; do sleep 1; done'
            adb devices -l
            
            # Run the tests
            pnpm run appium:android
          emulator-options: >
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
        timeout-minutes: 20

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-screenshots
          path: logs/screenshots/

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-logs
          path: |
            logs/appium/
            appium.log