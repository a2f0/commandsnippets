---
name: iOS Mobile Testing

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: '**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ios-testing.yml'

jobs:
  ios-appium-tests:
    runs-on: self-hosted
    continue-on-error: false
    defaults:
      run:
        working-directory: frontend

    env:
      # Use isolated directories to avoid conflicts
      DERIVED_DATA_PATH: /tmp/ci-ios-build
      SIMULATOR_DEVICE: "iPhone 16 CI"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          version: '11.21.0'
          runtime: 'node@24.19.0'
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false

      - name: Configure npm auth
        # yamllint disable-line rule:line-length
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Initialize Xcode and check iOS SDK
        run: |
          echo "Initializing Xcode command line tools..."
          # Skip xcode-select on self-hosted to avoid affecting local dev
          # sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "Selected Xcode version:"
          xcodebuild -version

          echo "Available iOS SDK version:"
          xcrun --sdk iphonesimulator --show-sdk-version

          echo "Available simulators:"
          xcrun simctl list devices available

      - name: Check for compatible iPhone simulator
        run: |
          if xcrun simctl list devices available |
             grep -q "iPhone 16"; then
            echo "Compatible iPhone simulator is available"
            xcrun simctl list devices available | grep iPhone
          else
            echo "No compatible iPhone simulator found, listing devices:"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Create required directories
        run: |
          mkdir -p logs/screenshots
          mkdir -p logs/appium

      - name: Build dev app with Capacitor (for testing)
        run: pnpm run build && pnpm exec cap sync

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          # Install pods and ensure they're properly integrated
          pod install --verbose
          echo "Checking Pods directory..."
          ls -la Pods/ || true

      - name: Build iOS app for simulator
        run: |
          cd ios/App
          # Use isolated build directory from env
          rm -rf "$DERIVED_DATA_PATH"
          # Build for simulator with explicit simulator targeting
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="x86_64 arm64" \
            VALID_ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify iOS build output
        run: |
          echo "Checking for built app..."
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/App.app"
          if [ -d "$APP_PATH" ]; then
            echo "SUCCESS: App.app found at expected location"
            ls -la \
              "$DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/"
          else
            echo "ERROR: App.app not found!"
            echo "Contents of build directory:"
            find "$DERIVED_DATA_PATH" -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

      - name: Start iOS simulator
        run: ./scripts/boot-ios-simulator.sh

      - name: Wait for simulator to be fully ready
        run: |
          echo "Waiting 30 seconds for simulator to be ready..."
          sleep 30

      - name: Run Appium iOS tests
        run: pnpm run appium:ios
        timeout-minutes: 10

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ios-test-screenshots
          path: frontend/logs/screenshots/

      - name: Upload test logs
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ios-test-logs
          path: |
            frontend/logs/appium/
            frontend/appium.log

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all
