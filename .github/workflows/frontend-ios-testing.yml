---
name: iOS Mobile Testing

# yamllint disable-line rule:truthy
# Pull requests run this through `CI` (ci.yml, the required `CI gate`).
on:
  workflow_dispatch:
  workflow_call:

jobs:
  ios-appium-tests:
    runs-on: macos-15
    continue-on-error: false
    defaults:
      run:
        working-directory: frontend

    env:
      # Capacitor 8 requires Xcode 26 or newer. Pin the installed toolchain so
      # changes to the runner image default do not silently downgrade CI.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      DERIVED_DATA_PATH: /tmp/ci-ios-build
      SIMULATOR_DEVICE: "iPhone 16 CI"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          version: '11.21.0'
          runtime: 'node@24.19.0'
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false

      - name: Configure npm auth
        # yamllint disable-line rule:line-length
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Initialize Xcode and check iOS SDK
        run: |
          echo "Initializing Xcode command line tools..."
          echo "Selected Xcode version:"
          xcodebuild -version

          echo "Available iOS SDK version:"
          xcrun --sdk iphonesimulator --show-sdk-version

          echo "Available simulators:"
          xcrun simctl list devices available

      - name: Check for compatible iPhone simulator
        run: |
          if xcrun simctl list devices available |
             grep -q "iPhone 16"; then
            echo "Compatible iPhone simulator is available"
            xcrun simctl list devices available | grep iPhone
          else
            echo "No compatible iPhone simulator found, listing devices:"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Build iOS app with Capacitor
        run: ../scripts/runCapacitorTests.sh ios build

      - name: Run Appium iOS tests
        run: ../scripts/runCapacitorTests.sh ios test
        timeout-minutes: 25

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ios-test-screenshots
          path: frontend/logs/screenshots/

      - name: Upload test logs
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ios-test-logs
          path: |
            frontend/logs/appium/
            frontend/appium.log

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all
