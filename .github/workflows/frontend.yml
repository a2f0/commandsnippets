---

name: Frontend CI
# yamllint disable-line rule:truthy
# Pull requests run this through `CI` (ci.yml, the required `CI gate`); pushes to
# the long-lived branches rerun the checks.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, staging]
    paths:
      - '.mise.toml'
      - 'packages/frontend/**'
      - 'packages/api-shared/**'
      - 'scripts/testing/runUnitTests.sh'
      - 'scripts/testing/runWebdriverTests.sh'
      - '.github/workflows/frontend.yml'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Bun and Node with mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15'
          architecture: 'x64'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Python code-quality tools
        run: pip install yamllint
      - name: Lint source
        run: bun run lint
      - name: Check formatting
        run: bun run format
      - name: Compile TypeScript
        run: bun run compile
      - name: Lint shell scripts
        run: >-
          find scripts ../../scripts -type f -name '*.sh' -print0 |
          xargs -0 shellcheck
      - name: Lint YAML
        run: yamllint -c .yamllint .
      - run: ../../scripts/testing/runUnitTests.sh
      - run: ../../scripts/testing/runWebdriverTests.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: wdio-video-reporter
          path: |
            packages/frontend/_results_
