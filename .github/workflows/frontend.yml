---

name: Frontend CI
# Pull requests run this through `CI` (ci.yml, the required `CI gate`); pushes to
# the long-lived branches rerun the checks. The static checks, the unit suite and
# the WebdriverIO suite are separate jobs, so they run in parallel; the caller
# sees their combined result.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, staging]
    paths:
      - '.ls-lint.yml'
      - '.mise.toml'
      - 'agent-tool.json'
      - 'assets/brand/**'
      - 'biome.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'knip.config.ts'
      - 'package.json'
      - 'packages/frontend/**'
      - 'packages/api-shared/**'
      - 'scripts/testing/runUnitTests.sh'
      - 'scripts/testing/runWebdriverTests.sh'
      - '.github/actions/setup/**'
      - '.github/workflows/frontend.yml'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint (Biome, file names, knip)
        run: bun run lint
      - name: Compile TypeScript
        run: bun run compile

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: ../../scripts/testing/runUnitTests.sh

  webdriver:
    # Pinned: on ubuntu-26.04 (ubuntu-latest since November 2026) every wdio
    # worker dies before its first spec, at @wdio/local-runner's first
    # `process.send`, with `write EINVAL`; the same commit, Bun, Node and
    # lockfile pass on ubuntu-24.04. Return to ubuntu-latest once a run there
    # passes.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: WebdriverIO tests
        run: ../../scripts/testing/runWebdriverTests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wdio-video-reporter
          path: |
            packages/frontend/_results_
