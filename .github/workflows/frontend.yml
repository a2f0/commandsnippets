---

name: Frontend CI
# yamllint disable-line rule:truthy
# Pull requests run this through `CI` (ci.yml, the required `CI gate`); pushes to
# the long-lived branches rerun the checks.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, staging]
    paths:
      - 'packages/frontend/**'
      - 'scripts/runUnitTests.sh'
      - 'scripts/runWebdriverTests.sh'
      - '.github/workflows/frontend.yml'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: '12.6.0'
          runtime: 'node@24.21.0'
          cache: true
          # Replaces the deprecated package-json-file; the cache key defaults
          # to pnpm-lock.yaml in this directory.
          working-directory: packages/frontend
          install: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          architecture: 'x64'
      # yamllint disable-line rule:line-length
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install
      - name: Install Python code-quality tools
        run: pip install yamllint
      - name: Lint source
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format
      - name: Compile TypeScript
        run: pnpm run compile
      - name: Lint shell scripts
        run: >-
          find scripts ../../scripts -type f -name '*.sh' -print0 |
          xargs -0 shellcheck
      - name: Lint YAML
        run: yamllint -c .yamllint .
      - run: ../../scripts/runUnitTests.sh
      - run: ../../scripts/runWebdriverTests.sh
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: wdio-video-reporter
          path: |
            packages/frontend/_results_
