---

name: Frontend CI
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: '**'
    paths:
      - 'frontend/**'
      - 'scripts/deployApp.sh'
      - 'scripts/deployProductionApp.sh'
      - 'scripts/deployStagingApp.sh'
      - 'scripts/runElectronTests.sh'
      - 'scripts/runUnitTests.sh'
      - 'scripts/runWebdriverTests.sh'
      - '.github/workflows/frontend.yml'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: '11.21.0'
          runtime: 'node@24.19.0'
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          architecture: 'x64'
      # yamllint disable-line rule:line-length
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install
      - name: Install Python code-quality tools
        run: pip install yamllint
      - name: Lint source
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format
      - name: Compile TypeScript
        run: pnpm run compile
      - name: Lint shell scripts
        run: >-
          find scripts ../scripts -type f -name '*.sh' -print0 |
          xargs -0 shellcheck
      - name: Lint YAML
        run: yamllint -c .yamllint .
      - run: ../scripts/runUnitTests.sh
      - run: ../scripts/runWebdriverTests.sh
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: wdio-video-reporter
          path: |
            frontend/_results_
  electron-tests:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: '11.21.0'
          runtime: 'node@24.19.0'
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false
      # yamllint disable-line rule:line-length
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install
      - name: Setup virtual display for Electron and install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
      - name: Build and run Electron E2E tests
        run: ../scripts/runElectronTests.sh
        env:
          DISPLAY: :99
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: electron-test-results
          path: |
            frontend/_results_
            frontend/logs/
  deploy-code:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: [code-quality, electron-tests]
    if: >-
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: '11.21.0'
          runtime: 'node@24.19.0'
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false
      - name: Configure AWS credentials (Production)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        # yamllint disable-line rule:line-length
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: us-east-1
      - name: Configure AWS credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        # yamllint disable-line rule:line-length
        if: ${{ github.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: us-east-1
      # yamllint disable-line rule:line-length
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install
      - name: Deploy to S3 (Production)
        # yamllint disable-line rule:line-length
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          DEPLOY_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
        run: ../scripts/deployProductionApp.sh
      - name: Deploy to S3 (Staging)
        # yamllint disable-line rule:line-length
        if: ${{ github.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        env:
          DEPLOY_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: ../scripts/deployStagingApp.sh
