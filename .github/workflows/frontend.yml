---

name: Frontend CI
# yamllint disable-line rule:truthy
# Pull requests run this through `CI` (ci.yml, the required `CI gate`); pushes to
# the long-lived branches rerun the checks.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, staging]
    paths:
      - 'packages/frontend/**'
      - 'packages/api-shared/**'
      - 'scripts/runUnitTests.sh'
      - 'scripts/runWebdriverTests.sh'
      - '.github/workflows/frontend.yml'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Bun installs and runs the scripts; Vitest, WebdriverIO and wrangler
      # still run on Node.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: packages/frontend/.nvmrc
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Python code-quality tools
        run: pip install yamllint
      - name: Lint source
        run: bun run lint
      - name: Check formatting
        run: bun run format
      - name: Compile TypeScript
        run: bun run compile
      - name: Lint shell scripts
        run: >-
          find scripts ../../scripts -type f -name '*.sh' -print0 |
          xargs -0 shellcheck
      - name: Lint YAML
        run: yamllint -c .yamllint .
      - run: ../../scripts/runUnitTests.sh
      - run: ../../scripts/runWebdriverTests.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: wdio-video-reporter
          path: |
            packages/frontend/_results_
