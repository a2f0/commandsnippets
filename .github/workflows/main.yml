name: Github Actions
on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  schedule:
  - cron: '0 0 * * *'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
       # Checks-out the repository into $GITHUB_WORKSPACE.
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        # Semantic version range syntax or exact version of a Python version
        python-version: '3.7'
        # Optional - x64 or x86 architecture, defaults to x64
        architecture: 'x64'
    - name: install and configure python dependencies
      run: pip install -r ./requirements/local.txt
    - name: Run pre-commit
      run: |
        pre-commit install
        pre-commit run --all-files
    - name: Run safety
      run: |
        safety check -r requirements/local.txt -r requirements/local.txt
    - name: run tests / coverage analysis
      run: |
        coverage run manage.py test -v 2
        coverage report
      env:
        DJANGO_SETTINGS_MODULE: tearleads.settings.test
        GITHUB_CLIENT_ID: github_client_id
        GITHUB_CLIENT_SECRET: github_client_secret
        GOOGLE_CLIENT_ID: google_client_id
        GOOGLE_CLIENT_SECRET: google_client_secret
        GOOGLE_REDIRECT_URI: google_redirect_uri
        POSTGRES_DB: postgres
        POSTGRES_HOST: localhost
        POSTGRES_PASSWORD: postgres
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
    - name: Post to slack
      uses: 8398a7/action-slack@v3
      if: ${{ failure() }}
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  push-containers:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: code-quality
    steps:
      - uses: actions/checkout@v2
      - name: Configure AWS credentials
        if: ${{ ( github.event.ref == 'refs/heads/staging' || github.event.ref == 'refs/heads/production' ) && github.event_name == 'push' }}
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        if: ${{ ( github.event.ref == 'refs/heads/staging' || github.event.ref == 'refs/heads/production' ) && github.event_name == 'push' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build SHA image
        if: ${{ ( github.event.ref == 'refs/heads/staging' || github.event.ref == 'refs/heads/production' ) && github.event_name == 'push' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f compose/django/Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
      - name: Tag and push staging images to Amazon ECR
        if: ${{ github.event.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:backend-staging-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-staging-latest
      - name: Tag and push production images to Amazon ECR
        if: ${{ github.event.ref == 'refs/heads/production' && github.event_name == 'push' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:backend-production-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-production-latest
      - name: Post to slack
        uses: 8398a7/action-slack@v3
        if: ${{ failure() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-code:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: push-containers
    steps:
      - name: Install SSH key
        if: ${{ ( github.event.ref == 'refs/heads/staging' || github.event.ref == 'refs/heads/production' ) && github.event_name == 'push' }}
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
      - name: Deploy production via SSH
        if: ${{ github.event.ref == 'refs/heads/production' && github.event_name == 'push' }}
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FQDN: ${{ secrets.DEPLOY_PRODUCTION_FQDN }}
        run: |
          ssh $DEPLOY_USER@$DEPLOY_FQDN /home/$DEPLOY_USER/tearleads-backend/deploy-containers.sh
      - name: Deploy staging via SSH
        if: ${{ github.event.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FQDN: ${{ secrets.DEPLOY_STAGING_FQDN }}
        run: |
          ssh $DEPLOY_USER@$DEPLOY_FQDN /home/$DEPLOY_USER/tearleads-backend/deploy-containers.sh
      - name: Post to slack
        uses: 8398a7/action-slack@v3
        if: ${{ failure() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
