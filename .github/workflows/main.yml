---

name: Github Actions
# yamllint disable-line rule:truthy
on:
  push:
    branches: '**'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tearleads'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      # yamllint disable-line rule:line-length
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
      - run: npx vitest --no-watch
      - run: npm run ci-headless
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: wdio-video-reporter
          path: |
            _results_
      - name: Post to slack
        uses: 8398a7/action-slack@v3
        if: ${{ failure() }}
        with:
          status: ${{ job.status }}
          # yamllint disable-line rule:line-length
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  electron-tests:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tearleads'
          package-manager-cache: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      # yamllint disable-line rule:line-length
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install
      - name: Setup virtual display for Electron and install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
      - name: Build and run Electron E2E tests
        run: |
          echo "=== Building Electron app ==="
          pnpm run electron:pack
          echo "=== Checking build output ==="
          find dist-electron -type f -name "*" | head -10
          ls -la dist-electron/linux-unpacked/ || \
            echo "linux-unpacked directory not found"
          echo "=== Running Electron tests ==="
          xvfb-run -a pnpm run electron:test
        env:
          DISPLAY: :99
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: electron-test-results
          path: |
            _results_
            logs/
      - name: Post to slack
        uses: 8398a7/action-slack@v3
        if: ${{ failure() }}
        with:
          status: ${{ job.status }}
          # yamllint disable-line rule:line-length
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-code:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: [code-quality, electron-tests]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tearleads'
          package-manager-cache: false
      - name: Configure AWS credentials (Production)
        uses: aws-actions/configure-aws-credentials@v5
        # yamllint disable-line rule:line-length
        if: ${{ github.event.ref == 'refs/heads/production' && github.event_name == 'push' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: us-east-1
      - name: Configure AWS credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v5
        # yamllint disable-line rule:line-length
        if: ${{ github.event.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: us-east-1
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      # yamllint disable-line rule:line-length
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install
      - run: npm run build
      - name: Deploy to S3 (Production)
        # yamllint disable-line rule:line-length
        if: ${{ github.event.ref == 'refs/heads/production' && github.event_name == 'push' }}
        run: |
          # First sync all assets (excluding index.html)
          aws s3 sync --acl=public-read ./build \
            s3://${{ secrets.PRODUCTION_DOMAIN }} --exclude "index.html"
          # Then copy index.html separately
          aws s3 cp --acl=public-read ./build/index.html \
            s3://${{ secrets.PRODUCTION_DOMAIN }}/index.html
          # Finally cleanup old files
          aws s3 sync --acl=public-read --delete ./build \
            s3://${{ secrets.PRODUCTION_DOMAIN }}
      - name: Deploy to S3 (Staging)
        # yamllint disable-line rule:line-length
        if: ${{ github.event.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        run: |
          # First sync all assets (excluding index.html)
          aws s3 sync --acl=public-read ./build \
            s3://${{ secrets.STAGING_DOMAIN }} --exclude "index.html"
          # Then copy index.html separately
          aws s3 cp --acl=public-read ./build/index.html \
            s3://${{ secrets.STAGING_DOMAIN }}/index.html
          # Finally cleanup old files
          aws s3 sync --acl=public-read --delete ./build \
            s3://${{ secrets.STAGING_DOMAIN }}
