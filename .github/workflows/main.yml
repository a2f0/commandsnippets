name: Github Actions
on:
  push:
    branches: '**'
  schedule:
    - cron: '0 0 * * *'
jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: npm ci
        run: npm ci
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
      - run: npx vitest --no-watch
      - run: npm run ci-headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdio-video-reporter
          path: |
            _results_
      - name: Post to slack
        uses: 8398a7/action-slack@v3
        if: ${{ failure() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-code:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (Production)
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ github.event.ref == 'refs/heads/production' && github.event_name == 'push' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: us-east-1
          role-session-name: GitHubActions
      - name: Configure AWS credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ github.event.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: us-east-1
          role-session-name: GitHubActions
      - name: Install dependencies
        run: npm ci
      - run: npm run build
      - name: Deploy to S3 (Production)
        if: ${{ github.event.ref == 'refs/heads/production' && github.event_name == 'push' }}
        run: aws s3 sync --acl=public-read ./build s3://${{ secrets.PRODUCTION_DOMAIN }}
      - name: Deploy to S3 (Staging)
        if: ${{ github.event.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        run: aws s3 sync --acl=public-read ./build s3://${{ secrets.STAGING_DOMAIN }}
