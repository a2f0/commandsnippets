name: Github Actions

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:

  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false

    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
       # Checks-out the repository into $GITHUB_WORKSPACE.
    - uses: actions/checkout@v2

    - name: Set up Python 3.6
      uses: actions/setup-python@v2
      with:
        # Semantic version range syntax or exact version of a Python version
        python-version: '3.6'
        # Optional - x64 or x86 architecture, defaults to x64
        architecture: 'x64'

    - name: install and configure python dependencies
      run: pip install -r ./requirements/local.txt

    - name: Run pre-commit
      run: |
        pre-commit install
        pre-commit run --all-files

    - name: run tests
      run: python manage.py test -v 2
      env:
        POSTGRES_DB: postgres
        POSTGRES_HOST: localhost
        POSTGRES_PASSWORD: postgres
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres

  push-containers:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: code-quality

    steps:

      - uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build SHA image
        if: github.event.ref == 'refs/heads/staging' || github.event.ref == 'refs/heads/production'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f compose/django/Dockerfile-prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Tag and push staging images to Amazon ECR
        if: github.event.ref == 'refs/heads/staging'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:backend-staging-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-staging-latest

      - name: Tag and push production images to Amazon ECR
        if: github.event.ref == 'refs/heads/production'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tftearleads
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:backend-production-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-production-latest

  deploy-code:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: push-containers

    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Deploy production via SSH
        if: github.event.ref == 'refs/heads/production'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FQDN: ${{ secrets.DEPLOY_PRODUCTION_FQDN }}
        run: |
          ssh $DEPLOY_USER@$DEPLOY_FQDN /home/$DEPLOY_USER/tearleads-backend/deploy-containers.sh

      - name: Deploy staging via SSH
        if: github.event.ref == 'refs/heads/staging'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FQDN: ${{ secrets.DEPLOY_STAGING_FQDN }}
        run: |
          ssh $DEPLOY_USER@$DEPLOY_FQDN /home/$DEPLOY_USER/tearleads-backend/deploy-containers.sh

  post-to-slack:
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: deploy-code

    steps:
      - uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
