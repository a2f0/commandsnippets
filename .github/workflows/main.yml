name: Github Actions

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:

  push-containers:
    runs-on: ubuntu-latest
    continue-on-error: false
    
    steps:

      - uses: actions/checkout@v2

      - name: Set up Python 3.5
        uses: actions/setup-python@v2
        with:
          python-version: '3.5'
          architecture: 'x64'