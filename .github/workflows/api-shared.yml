---
name: API Shared CI
# Pull requests run this through `CI` (ci.yml, the required `CI gate`), which
# also runs the lanes of the packages that consume api-shared.
on:
  workflow_dispatch:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test with coverage (fails under 98%)
        run: bun run test
