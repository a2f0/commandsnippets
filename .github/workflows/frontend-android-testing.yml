---
name: Android Mobile Testing

# Appium execution is temporarily disabled.
# Set the ENABLE_MOBILE_APPIUM_TESTS repository variable to true to re-enable.

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: '**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-android-testing.yml'

jobs:
  android-appium-tests:
    if: vars.ENABLE_MOBILE_APPIUM_TESTS == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          version: '11.21.0'
          runtime: 'node@24.19.0'
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false

      - name: Configure npm auth
        # yamllint disable-line rule:line-length
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" \
            >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Setup JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Accept Android licenses and download system images
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "system-images;android-35;google_apis;x86_64"
          sdkmanager "platform-tools" "platforms;android-36"
          echo "Android SDK packages installed:"
          sdkmanager --list_installed

      - name: AVD cache
        uses: actions/cache@v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # yamllint disable-line rule:line-length
          key: avd-api-35-pixel-6a-${{ runner.os }}-${{ hashFiles('frontend/android/**') }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666",' \
            'OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6a
          force-avd-creation: false
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Create required directories
        run: |
          mkdir -p logs/screenshots
          mkdir -p logs/appium

      - name: Start dev server
        run: |
          pnpm run dev &
          sleep 10
          curl -f http://localhost:8085 || exit 1
          echo "Dev server started successfully"

      - name: Build dev web app
        run: pnpm run build

      - name: Sync Capacitor for dev
        run: npx cap sync

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDevelopmentDebug --no-daemon
          echo "APK build completed"
          ls -la app/build/outputs/apk/development/debug/

      - name: Verify Android APK
        run: |
          APK_PATH="android/app/build/outputs/apk/development/debug/app-development-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "SUCCESS: APK found at expected location"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK not found!"
            find android -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi

      - name: Run Android Appium tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6a
          script: cd frontend && ./scripts/run-android-tests.sh
          emulator-options: >
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
        timeout-minutes: 20

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-test-screenshots
          path: frontend/logs/screenshots/

      - name: Upload test logs
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-test-logs
          path: |
            frontend/logs/appium/
            frontend/appium.log
