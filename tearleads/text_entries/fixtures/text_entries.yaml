- model: text_entries.TextEntry
  pk: 90
  fields:
    user_id: 1
    subject: install cert-manager on k8s
    body: |
      kubectl create namespace cert-manager
      # Disable resource validation on the cert-manager namespace
      kubectl label namespace cert-manager certmanager.k8s.io/disable-validation=true
      kubectl apply -f https://github.com/jetstack/cert-manager/releases/download/v0.9.1/cert-manager.yaml
      kubectl get pods --namespace cert-manager #make sure the cert-manager namnespace has some pods running
    date_created: "2019-08-20T18:21:00+00:00"
    date_updated: "2019-08-20T18:21:00+00:00"
    
- model: text_entries.TextEntry
  pk: 91
  fields:
    user_id: 1
    subject: deploy self-signed test resource using cert-manager
    body: | 
      cat <<EOF > test-resources.yaml
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager-test
      ---
      apiVersion: certmanager.k8s.io/v1alpha1
      kind: Issuer
      metadata:
        name: test-selfsigned
        namespace: cert-manager-test
      spec:
        selfSigned: {}
      ---
      apiVersion: certmanager.k8s.io/v1alpha1
      kind: Certificate
      metadata:
        name: selfsigned-cert
        namespace: cert-manager-test
      spec:
        commonName: example.com
        secretName: selfsigned-cert-tls
        issuerRef:
          name: test-selfsigned
      EOF
      kubectl apply -f test-resources.yaml
      kubectl describe certificate -n cert-manager-test
      kubectl delete -f test-resources.yaml
    date_created: "2019-08-20T18:21:00+00:00"
    date_updated: "2019-08-20T18:21:00+00:00"
    
- model: text_entries.TextEntry
  pk: 92
  fields:
    user_id: 1
    subject: cert-manager staging issuer
    body: | 
      cat <<EOF > letsencrypt-staging.yaml
      apiVersion: certmanager.k8s.io/v1alpha1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging
      spec:
        acme:
          # You must replace this email address with your own.
          # Let's Encrypt will use this to contact you about expiring
          # certificates, and issues related to your account.
          email: user@example.com
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            # Secret resource used to store the account's private key.
            name: example-issuer-account-key
          # Add a single challenge solver, HTTP01 using nginx
          solvers:
          - http01:
              ingress:
                class: nginx
    date_created: "2019-08-20T18:21:00+00:00"
    date_updated: "2019-08-20T18:21:00+00:00"

