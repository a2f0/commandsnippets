repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: 'https://github.com/gruntwork-io/pre-commit'
    rev: v0.1.28
    hooks:
      - id: terraform-fmt
        args:
          - --recursive
      - id: tflint
        args:
          - --recursive
      - id: shellcheck
      - id: gofmt
      - id: golint
