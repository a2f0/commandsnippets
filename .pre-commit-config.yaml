repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$
  - repo: local
    hooks:
      - id: check-for-unpinned-dependencies
        name: check-for-unpinned-dependencies
        entry: npx check-for-unpinned-dependencies
        pass_filenames: false
        language: node
      - id: biome format
        name: biome format
        entry: npx biome format
        pass_filenames: false
        language: node
      - id: biome lint
        name: biome lint
        entry: npx biome lint
        pass_filenames: false
        language: node
      - id: tsc
        name: tsc
        entry: npx tsc -b
        pass_filenames: false
        language: node
