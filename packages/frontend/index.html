<!DOCTYPE html>
<html lang="en" data-version="<%= VITE_APP_VERSION %>">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Commandsnippets – Note-Taking for Technical Professionals</title>
    <meta name="description" content="Commandsnippets is an opinionated note-taking system for technical professionals. Save command snippets, tag them, and order tags and entries your way." />
    <!--
      No canonical or og:url: every route serves this page, including users'
      public pages (/:user/:tag), which are distinct, shareable content. Naming
      the root would mark them duplicates of it and point shares at it.
    -->
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commandsnippets" />
    <meta property="og:title" content="Commandsnippets – Note-Taking for Technical Professionals" />
    <meta property="og:description" content="Commandsnippets is an opinionated note-taking system for technical professionals. Save command snippets, tag them, and order tags and entries your way." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
