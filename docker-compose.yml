version: '2'

volumes:
  postgres_data_dev: {}
  postgres_backup_dev: {}

services:
  postgres:
    build: ./compose/postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - postgres_backup_dev:/backups
    env_file: .env
    ports:
      - "5432:5432"
    # uncomment below for full statement logging to stdout
    # command: postgres -c log_statement=all
  django:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile-dev
    command: python /app/manage.py runserver 0.0.0.0:8000
    depends_on:
      - postgres
    env_file: .env
    volumes:
      - .:/app:cached
    ports:
      - "8000:8000"
    links:
      - postgres