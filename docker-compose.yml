version: '2'

volumes:
  postgres_data_dev: {}
  postgres_backup_dev: {}

services:
  postgres:
    build: ./compose/postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - postgres_backup_dev:/backups
    env_file: .env
    ports:
      - "${POSTGRES_DOCKER_PORT}:5432"
    # uncomment below for full statement logging to stdout
    # command: postgres -c log_statement=all
  backend:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile.dev
    depends_on:
      - postgres
    env_file: .env
    volumes:
      - .:/app:cached
    ports:
      - "9001:9001"
    links:
      - postgres
